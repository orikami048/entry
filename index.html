<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>入口</title>
    <style>
      * { box-sizing: border-box; }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        background: #0f172a;
        color: #e2e8f0;
        padding: 24px;
      }
      .container {
        text-align: center;
        max-width: 600px;
        width: 100%;
      }
      h1 { font-size: 42px; margin: 0 0 8px; font-weight: 700; }
      p { color: #94a3b8; margin: 0 0 36px; font-size: 16px; }
      .btn-group {
        display: flex;
        gap: 16px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .btn {
        display: inline-block;
        padding: 14px 36px;
        color: #fff;
        text-decoration: none;
        border-radius: 10px;
        font-size: 17px;
        font-weight: 600;
        transition: background .2s, transform .2s, box-shadow .2s;
        cursor: pointer;
      }
      .btn-ziwei {
        background: #3b82f6;
        box-shadow: 0 4px 14px rgba(59,130,246,.35);
      }
      .btn-ziwei:hover {
        background: #2563eb;
        transform: translateY(-2px);
        box-shadow: 0 6px 18px rgba(59,130,246,.45);
      }
      .btn-fangji {
        background: #059669;
        box-shadow: 0 4px 14px rgba(5,150,105,.35);
      }
      .btn-fangji:hover {
        background: #047857;
        transform: translateY(-2px);
        box-shadow: 0 6px 18px rgba(5,150,105,.45);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>入口</h1>
      <p>Cloudflare Pages 部署测试</p>
      <div class="btn-group">
        <a class="btn btn-ziwei" href="https://ziwei-doushu-d4e.pages.dev">紫微斗数排盘</a>
        <a class="btn btn-fangji" href="https://fangji-2oh.pages.dev/">药剂主页</a>
      </div>
    </div>
  </body>
</html>
